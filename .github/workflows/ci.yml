name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 30
    # 外部の Action はタグの付け替えで中身が変わらないよう、コミットの SHA で固定する（コメントは対応するタグ）
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '11.0.x'
      - uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1
      # MSVC の Platform=x64 はソリューションの Any CPU 構成と衝突する。
      - name: ソリューションのプラットフォームを既定に戻す
        shell: pwsh
        run: '"Platform=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13
        with:
          luaVersion: '5.4.8'
      - name: Lua Language Server を用意
        shell: pwsh
        run: |
          $version = '3.19.2'
          # 版を変えるときはハッシュも変える（GitHub のリリースの digest と同じ値）
          $sha256 = '4A3DC851B3B31E7B75A23F645D1BA4A2137579A55F5FA4EDBB17A3E2A6254044'
          $dir = Join-Path $env:RUNNER_TEMP 'lua-language-server'
          $zip = Join-Path $env:RUNNER_TEMP 'lua-language-server.zip'
          Invoke-WebRequest "https://github.com/LuaLS/lua-language-server/releases/download/$version/lua-language-server-$version-win32-x64.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "lua-language-server の zip のハッシュが一致しません: $actual" }
          Expand-Archive $zip $dir
          (Join-Path $dir 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 依存関係を復元
        run: dotnet restore yazipane.slnx
      - name: C# のテスト
        run: dotnet test yazipane.slnx --no-restore
      - name: Lua のテスト
        shell: pwsh
        run: |
          lua Yazipane.Tests/lua/plugin_test.lua Yazipane/assets/yazi/plugins/yazipane.yazi/main.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lua Yazipane.Tests/lua/wezterm_test.lua Yazipane/assets/wezterm.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: C# の書式
        run: dotnet format yazipane.slnx --no-restore --verify-no-changes
      - name: C# のスタイル
        run: dotnet format style yazipane.slnx --no-restore --severity info --verify-no-changes
      - name: Lua の静的チェック
        shell: pwsh
        run: |
          if (-not (Get-Command lua-language-server -ErrorAction SilentlyContinue)) { throw 'lua-language-server が見つかりません' }
          ./tools/lua-check.ps1
      - name: NativeAOT ビルド
        run: dotnet publish Yazipane -c Release --no-restore -o ${{ runner.temp }}/yazipane-publish
